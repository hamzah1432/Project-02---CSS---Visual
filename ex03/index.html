<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03: Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="swatch-container">
        <div class="swatch named">Named</div>
        <div class="swatch hex">HEX</div>
        <div class="swatch rgb">RGB</div>
        <div class="swatch rgba">RGBA</div>
    </section>

    <section class="comparison-container">
        <div class="box opacity-box">
            <p>Opacity 0.5</p>
        </div>
        <div class="box rgba-box">
            <p>RGBA 0.5</p>
        </div>
    </section>
</body>

</html>
